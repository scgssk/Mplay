# Render Blueprint – Mplay Backend
services:
  - type: web
    name: mplay-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: LASTFM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CACHE_TTL
        value: "3600"
      - key: MAX_SEARCH_RESULTS
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.0"
